[theme]
base = "dark"
primaryColor = "#4fd1c5"
backgroundColor = "#0e1621"
secondaryBackgroundColor = "#161f2c"
textColor = "#e6edf3"
font = "sans serif"

[server]
# The app reads a committed SQLite artefact and a committed model. It makes
# no outbound network calls at runtime by design.
enableStaticServing = false

[browser]
gatherUsageStats = false
